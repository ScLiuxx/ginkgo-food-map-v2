name: CI and automatic deployment

# PR先检查；develop推送检查通过且新服务器就绪后自动发布同一提交。
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# 更新PR时取消旧检查；develop发布不中断，部署作业另有串行锁。
concurrency:
  group: foodmap-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅供本次临时 CI 容器使用，不是开发或生产凭据。
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
          # 统计测试拒绝默认业务端口；仍连接本作业临时MySQL、创建随机库。
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      activity-redis:
        image: redis:8-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify including real MySQL and Redis integration tests
        working-directory: backend
        env:
          AUTH_TEST_DB_PASSWORD: ci-only-mysql-password
          # 餐厅迁移测试使用同一个临时MySQL服务，但创建自己专属的随机数据库。
          RESTAURANT_TEST_DB_PASSWORD: ci-only-mysql-password
          # 点评与回复使用独立随机库验证完整迁移链，不访问真实业务库或OSS。
          REVIEW_TEST_DB_PASSWORD: ci-only-mysql-password
          # 回复集成测试要求显式指定隔离服务器；连接本作业的临时MySQL容器。
          REVIEW_TEST_DB_SERVER: jdbc:mysql://127.0.0.1:3306/
          ACTIVITY_TEST_DB_SERVER: jdbc:mysql://127.0.0.1:13306/
          ACTIVITY_TEST_DB_USERNAME: root
          ACTIVITY_TEST_DB_PASSWORD: ci-only-mysql-password
          ACTIVITY_TEST_REDIS_PORT: '16379'
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          -Dredis.integration=true -Dauth.integration=true
          -Drestaurant.integration=true -Dreview.integration=true
          -Dactivity.structure.integration=true -Dactivity.backend.integration=true
      - name: Save test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Save checked JAR
        uses: actions/upload-artifact@v4
        with:
          name: checked-backend
          path: backend/target/foodmap-backend-*.jar
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # JS Key允许进入浏览器构建；高德安全密钥只留在服务器Nginx配置。
      VITE_AMAP_KEY: ${{ vars.VITE_AMAP_KEY }}
      VITE_AMAP_SERVICE_HOST: /_AMapService
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require browser map configuration before automatic deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AUTO_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          [[ "$VITE_AMAP_KEY" =~ ^[[:xdigit:]]{32}$ ]] || {
            echo 'Configure repository variable VITE_AMAP_KEY before deployment.' >&2
            exit 1
          }
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test, typecheck and build
        working-directory: frontend
        run: npm run check
      - name: Save checked frontend
        uses: actions/upload-artifact@v4
        with:
          name: checked-frontend
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy checked commit
    needs: [backend, frontend, deployment-checks]
    # 仓库变量是首次配置的就绪开关，开启后无需逐次确认；PR不读取部署密钥。
    if: github.repository == 'kanno111/foodmap' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AUTO_DEPLOY_ENABLED == 'true'
    # 测试、打包和SSH客户端均在GitHub托管机器执行。
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    # 不取消正在切换版本的部署，避免进程被中断后留下半完成状态。
    concurrency:
      group: foodmap-server-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip a commit superseded while checks were running
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 使用本作业的只读令牌确认develop，服务器无需连接GitHub。
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/develop"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'foodmap-deployment',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              latest = json.load(response)['object']['sha']
          current = latest == os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"current={str(current).lower()}\n")
          if not current:
              print('A newer develop commit exists; skipping this deployment.')
          PY
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with:
          name: checked-backend
          path: release/backend
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with:
          name: checked-frontend
          path: release/frontend
      - name: Package the exact artifacts that passed checks
        if: steps.latest.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release/backend/*.jar)
          test "${#jars[@]}" -eq 1
          mv "${jars[0]}" release/backend.jar
          printf '%s\n' "$GITHUB_SHA" > release/commit.txt
          printf '%s\n' "$GITHUB_SHA" > release/frontend/version.txt
          tar -czf release.tar.gz -C release backend.jar frontend commit.txt
          sha256sum release.tar.gz > SHA256SUMS
      - name: Upload and activate checked release over SSH
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: bash deploy/ssh-publish.sh

  deployment-checks:
    name: Deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check script syntax and release failure handling
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/ssh-publish.sh
          sudo visudo -cf deploy/foodmap-deploy.sudoers
          python3 -m py_compile deploy/application/prepare.py deploy/nginx/prepare.py
          python3 -m unittest discover -s deploy/tests -v
