# 宿主机 Nginx 配置；Docker前端开发配置仍留在 frontend/deploy 中。
# 先安装与Nginx发行版本匹配的njs扩展，并由初始化步骤准备下方引用文件。
js_import foodmap_amap from /etc/nginx/foodmap/amap-proxy.js;

upstream foodmap_amap_rest {
    server restapi.amap.com:443;
}

upstream foodmap_amap_web {
    server webapi.amap.com:443;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    root /opt/foodmap/current/frontend;
    index index.html;
    client_max_body_size 10m;
    include /etc/nginx/foodmap/amap-credentials.conf;
    set $foodmap_amap_path "";
    set $foodmap_amap_query "";

    # 首次发布前明确返回等待状态，避免单页应用回退到尚不存在的 index.html。
    if (!-f /opt/foodmap/current/frontend/index.html) {
        return 503 "Application deployment pending\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /_AMapService {
        access_log off;
        error_log /dev/null crit;
        js_content foodmap_amap.handle;
    }

    location @foodmap_amap_rest {
        include /etc/nginx/foodmap/amap-proxy-common.conf;
        proxy_set_header Host restapi.amap.com;
        proxy_ssl_name restapi.amap.com;
        proxy_pass https://foodmap_amap_rest$foodmap_amap_path?$foodmap_amap_query;
    }

    location @foodmap_amap_web {
        include /etc/nginx/foodmap/amap-proxy-common.conf;
        proxy_set_header Host webapi.amap.com;
        proxy_ssl_name webapi.amap.com;
        proxy_pass https://foodmap_amap_web$foodmap_amap_path?$foodmap_amap_query;
    }

    location @foodmap_amap_redirect {
        access_log off;
        error_log /dev/null crit;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 502 '{"code":"MAP_UPSTREAM_REDIRECT"}';
    }

    location @foodmap_amap_unavailable {
        access_log off;
        error_log /dev/null crit;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 502 '{"code":"MAP_UPSTREAM_UNAVAILABLE"}';
    }

    # 消息流关闭代理缓冲，心跳维持连接。
    location = /api/me/notifications/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /version.txt {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
